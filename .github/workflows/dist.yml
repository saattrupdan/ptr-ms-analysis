name: package

# PyInstaller cannot cross-compile, and neither can an installer tool: an .msi has to
# be built by Windows Installer tooling and a .dmg by hdiutil. So each operating system
# builds its own artifact. The repo is public, so these runners are free; a tag
# additionally publishes a GitHub Release.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "src/**"
      - "scripts/smoke_frozen.py"
      - "pyproject.toml"
      - ".github/workflows/dist.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            # WiX needs the .NET SDK, which the Windows runner image already has.
            installer: msi
            exe: dist/ptr/ptr.exe
          - os: macos-latest
            label: macos-arm64
            installer: dmg
            exe: dist/PTR-MS Review.app/Contents/MacOS/ptr
            # An Intel Mac build would be a third entry: { os: macos-13,
            # label: macos-x86_64, exe: dist/PTR-MS Review.app/Contents/MacOS/ptr }.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build the bundle
        run: pyinstaller --noconfirm packaging/ptr-app.spec

      - name: Check the bundle actually serves a review
        run: python scripts/smoke_frozen.py "${{ matrix.exe }}"

      - name: Build the Windows installer
        if: matrix.installer == 'msi'
        run: |
          # WiX v3 is the last MIT-licensed toolchain. WiX v6 and later refuse to build
          # anything until the Open Source Maintenance Fee EULA is accepted, which asks
          # a fee of anyone shipping a product for money; there is no reason to put that
          # condition on this project's builds.
          curl.exe -sSL -o wix3.zip https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          Expand-Archive -Path wix3.zip -DestinationPath wix3 -Force
          python packaging/make_msi.py dist/ptr build/msi/ptr-app.wxs
          wix3/candle.exe -arch x64 -out build/msi/ptr-app.wixobj build/msi/ptr-app.wxs
          wix3/light.exe -o dist/ptr.msi build/msi/ptr-app.wixobj

      - name: Check the installed app, not just the built one
        if: matrix.installer == 'msi'
        run: |
          $p = Start-Process msiexec.exe -ArgumentList '/i',"$PWD\dist\ptr.msi",'/qn','/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install failed with exit code $($p.ExitCode)" }
          python scripts/smoke_frozen.py "C:\Program Files\PTR-MS Review\ptr.exe"

      - name: Build the disk image
        if: matrix.installer == 'dmg'
        run: |
          stage=$(mktemp -d)
          cp -R "dist/PTR-MS Review.app" "$stage/"
          ln -s /Applications "$stage/Applications"
          cat > "$stage/Read me first.txt" <<'TXT'
          PTR-MS Review

          Drag the icon onto Applications, then start it from Launchpad or the Terminal
          (`ptr app`). It opens its review page in your browser and serves it from this
          computer only. To stop it, use "Stop the app" on that page.

          The first start is blocked by macOS because the app is unsigned: open it once
          with right-click (or Control-click) → Open. Nothing is downloaded or uploaded;
          the page talks to 127.0.0.1.
          TXT
          hdiutil create -quiet -volname "PTR-MS Review" -srcfolder "$stage" -ov \
            -format UDZO dist/ptr.dmg

      - name: Check the mounted image, not just the built app
        if: matrix.installer == 'dmg'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/ptr-mount dist/ptr.dmg
          python scripts/smoke_frozen.py "/tmp/ptr-mount/PTR-MS Review.app/Contents/MacOS/ptr"
          hdiutil detach /tmp/ptr-mount

      # Named after the installer exists: naming it before building it is a mistake
      # worth remembering, because the smoke test above passes either way.
      - name: Name it
        run: mv "dist/ptr.${{ matrix.installer }}" "dist/ptr-review-${{ matrix.label }}.${{ matrix.installer }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ptr-review-${{ matrix.label }}
          path: dist/ptr-review-${{ matrix.label }}.${{ matrix.installer }}
          if-no-files-found: error

  release:
    name: Publish the release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ptr-review-*
          path: bundles

      - name: Attach the installers to the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(bundles/*/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installers were produced" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes "${files[@]}"
