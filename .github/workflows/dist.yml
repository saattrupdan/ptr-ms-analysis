name: package

# PyInstaller cannot cross-compile, so each bundle is built on its own OS. The repo is
# public, so these runners are free; a tag additionally publishes a GitHub Release.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "src/**"
      - "scripts/smoke_frozen.py"
      - "pyproject.toml"
      - ".github/workflows/dist.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            exe: dist/ptr/ptr.exe
          - os: macos-latest
            label: macos-arm64
            exe: dist/ptr/ptr
            # An Intel Mac build would be a third entry: { os: macos-13,
            # label: macos-x86_64, exe: dist/ptr/ptr }.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build the folder bundle
        run: pyinstaller --noconfirm packaging/ptr-app.spec

      - name: Check the bundle actually serves a review
        run: python scripts/smoke_frozen.py ${{ matrix.exe }}

      - name: Zip it
        shell: bash
        run: (cd dist && zip -q -r ../ptr-app-${{ matrix.label }}.zip ptr)

      - uses: actions/upload-artifact@v4
        with:
          name: ptr-app-${{ matrix.label }}
          path: ptr-app-${{ matrix.label }}.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ptr-app-*
          path: bundles

      - name: Attach the bundles to the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(bundles/*/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no bundles were produced" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes "${files[@]}"
