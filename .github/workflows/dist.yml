name: package

# PyInstaller cannot cross-compile, and neither can an installer tool: an .msi has to
# be built by Windows Installer tooling and a .pkg by pkgbuild and productbuild. So each
# operating system builds its own artifact. The repo is public, so these runners are
# free; a tag additionally publishes a GitHub Release. packaging/README.md is the guide.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "src/**"
      - "scripts/smoke_frozen.py"
      - "pyproject.toml"
      - ".github/workflows/dist.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            # WiX needs the .NET SDK, which the Windows runner image already has.
            installer: msi
            exe: dist/sniff/sniff.exe
            smoke_args: ""
          - os: macos-latest
            label: macos-arm64
            installer: pkg
            exe: dist/Sniff.app/Contents/MacOS/sniff
            # Every second invocation of a windowed executable can stall before
            # Python starts on hosted macOS. Verify review and start screens in one
            # process there; Windows CI and local macOS retain all launch probes.
            smoke_args: --single-launch
            # An Intel Mac build would be a third entry: { os: macos-13,
            # label: macos-x86_64, exe: dist/Sniff.app/Contents/MacOS/sniff }.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          # The desktop extra is what makes the bundle open a window rather than a
          # browser tab; the spec picks it up automatically when it is installed.
          pip install ".[desktop]" pyinstaller

      - name: Remove stale bundle output
        run: python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('dist', 'build')]"

      - name: Build the bundle
        run: pyinstaller --noconfirm packaging/sniff-app.spec

      - name: Check the bundle actually serves a review
        run: python scripts/smoke_frozen.py "${{ matrix.exe }}" ${{ matrix.smoke_args }}

      - name: Build the Windows installer
        if: matrix.installer == 'msi'
        run: |
          # WiX v3 is the last MIT-licensed toolchain. WiX v6 and later refuse to build
          # anything until the Open Source Maintenance Fee EULA is accepted, which asks
          # a fee of anyone shipping a product for money; there is no reason to put that
          # condition on this project's builds.
          curl.exe -sSL -o wix3.zip https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          Expand-Archive -Path wix3.zip -DestinationPath wix3 -Force
          python packaging/make_msi.py dist/sniff build/msi/sniff-app.wxs
          wix3/candle.exe -arch x64 -out build/msi/sniff-app.wixobj build/msi/sniff-app.wxs
          wix3/light.exe -o dist/sniff.msi build/msi/sniff-app.wixobj

      - name: Check the installed app, not just the built one
        if: matrix.installer == 'msi'
        run: |
          $p = Start-Process msiexec.exe -ArgumentList '/i',"$PWD\dist\sniff.msi",'/qn','/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install failed with exit code $($p.ExitCode)" }
          python scripts/smoke_frozen.py "C:\Program Files\Sniff\sniff.exe"

      - name: Build the macOS package
        if: matrix.installer == 'pkg'
        run: |
          # Two tools, two artifacts-in-one: pkgbuild wraps the bundle in a component
          # package (payload plus bill of materials) and productbuild wraps that in the
          # distribution make_pkg.py writes (title, version, minimum system, arch).
          version=$(python packaging/make_pkg.py --print-version)
          python packaging/make_pkg.py --out build/pkg --arch "$(uname -m)"
          pkgbuild --component "dist/Sniff.app" --install-location /Applications \
            --identifier dk.samsmart.sniff --version "$version" build/pkg/sniff-component.pkg
          productbuild --distribution build/pkg/distribution.xml \
            --package-path build/pkg dist/sniff.pkg

      - name: Check the installed app, not just the built one
        if: matrix.installer == 'pkg'
        run: |
          installer -pkginfo -pkg dist/sniff.pkg
          # Two things have to be true before this proves anything. The built
          # bundle must be out of the way: the smoke above ran it, so LaunchServices
          # knows that bundle id at that path, and installd will then 'relocate' the
          # install onto it -- install.log says so, and /Applications stays empty.
          # And the result must be read from the filesystem, because installer
          # reports success without regard to where the payload went.
          LSREGISTER=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$LSREGISTER" -u "$PWD/dist/Sniff.app" 2>/dev/null || true
          mv "dist/Sniff.app" "$RUNNER_TEMP/built-app"
          sudo installer -pkg dist/sniff.pkg -target / -verboseR
          installed=""
          for _ in $(seq 1 60); do
            installed=$(find /Applications -maxdepth 1 -name "Sniff.app" | head -1)
            [ -n "$installed" ] && break
            sleep 0.5
          done
          if [ -z "$installed" ]; then
            echo "installed nothing under /Applications; install.log said:"
            sudo grep -i "sniff\|ptrms\|PTR-MS" /var/log/install.log | tail -15 || true
            exit 1
          fi
          echo "installed at: $installed"
          python scripts/smoke_frozen.py "$installed/Contents/MacOS/sniff" --single-launch

      # Named after the installer exists: naming it before building it is a mistake
      # worth remembering, because the smoke test above passes either way.
      - name: Name it
        run: mv "dist/sniff.${{ matrix.installer }}" "dist/sniff-review-${{ matrix.label }}.${{ matrix.installer }}"

      - uses: actions/upload-artifact@v4
        with:
          name: sniff-review-${{ matrix.label }}
          path: dist/sniff-review-${{ matrix.label }}.${{ matrix.installer }}
          if-no-files-found: error

  release:
    name: Publish the release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sniff-review-*
          path: bundles

      - name: Attach the installers to the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(bundles/*/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installers were produced" >&2
            exit 1
          fi
          # --repo because this job never checks the repository out: without a .git
          # to read, gh cannot work out which repository the tag belongs to and dies
          # with "failed to run git: fatal: not a git repository".
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --generate-notes --latest "${files[@]}"
